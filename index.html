<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Box Shadow · Editor visual de sombras CSS</title>
  <meta name="description" content="Crie sombras CSS com várias camadas, arraste para ajustar e copie o código em CSS ou Tailwind. Compartilhe a configuração por link.">
  <meta name="theme-color" content="#e9edf2">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="Box Shadow · Editor visual de sombras CSS">
  <meta property="og:description" content="Várias camadas, arrastar para ajustar, exportação para CSS e Tailwind.">
  <meta property="og:image" content="https://box-shadow.vercel.app/docs/preview.png">
  <link rel="preload" href="assets/fonts/schibsted-grotesk-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="src/main.js" type="module"></script>
</head>
<body>
  <header class="masthead">
    <h1 class="masthead__title">Box Shadow</h1>
    <p class="masthead__lead">Monte a sombra em camadas, arraste para ajustar e copie o código.</p>
    <a class="masthead__link" href="https://github.com/wagnerglongo/Box-shadow">Código no GitHub</a>
  </header>

  <main class="editor">
    <aside class="panel" aria-label="Configurações">
      <section class="panel__group" aria-labelledby="presets-title">
        <h2 class="panel__title" id="presets-title">Modelos</h2>
        <div class="presets" id="presets"></div>
      </section>

      <section class="panel__group" aria-labelledby="layers-title">
        <div class="panel__row">
          <h2 class="panel__title" id="layers-title">Camadas</h2>
          <div class="panel__actions">
            <button class="icon-button" type="button" id="add-layer" aria-label="Adicionar camada" title="Adicionar camada">+</button>
            <button class="icon-button" type="button" id="remove-layer" aria-label="Remover camada selecionada" title="Remover camada selecionada">−</button>
          </div>
        </div>
        <div class="layers" id="layers" role="radiogroup" aria-labelledby="layers-title"></div>
        <div class="fields" id="layer-fields"></div>
      </section>

      <section class="panel__group" aria-labelledby="box-title">
        <h2 class="panel__title" id="box-title">Caixa e fundo</h2>
        <div class="fields" id="box-fields"></div>
      </section>
    </aside>

    <section class="workspace" aria-label="Pré-visualização e código">
      <div class="stage" id="stage" tabindex="0"
           aria-label="Pré-visualização. Arraste ou use as setas do teclado para mover a sombra da camada selecionada.">
        <div class="stage__box" id="box"></div>
        <p class="stage__hint">Arraste aqui para mover a sombra · setas do teclado também funcionam</p>
      </div>

      <div class="output">
        <div class="output__bar">
          <div class="tabs" role="tablist" aria-label="Formato do código">
            <button class="tab" role="tab" type="button" id="tab-css" aria-selected="true" aria-controls="code">CSS</button>
            <button class="tab" role="tab" type="button" id="tab-tailwind" aria-selected="false" aria-controls="code">Tailwind</button>
          </div>
          <div class="output__actions">
            <button class="button" type="button" id="copy-code">Copiar código</button>
            <button class="button button--quiet" type="button" id="copy-link">Copiar link</button>
          </div>
        </div>
        <pre class="code" id="code" role="tabpanel" tabindex="0"><code></code></pre>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Feito por <a href="https://github.com/wagnerglongo">Wagner Longo</a>. HTML, CSS e JavaScript puro, sem dependências.</p>
  </footer>
</body>
</html>
